<div class="upload-card">
    <form action="{{ url_for('frontend.upload_recipe') }}" method="POST" enctype="multipart/form-data" id="upload-form">
        <label class="upload-dropzone" id="upload-dropzone">
            <sl-icon name="cloud-upload"></sl-icon>
            <span class="dropzone-title">Click to choose files or drag them here</span>
            <span>BeerXML recipes (.xml, .beerxml)</span>
            <input type="file" multiple accept=".xml,.beerxml" name="recipes" id="upload-input"/>
        </label>
        <ul class="upload-file-list" id="upload-file-list"></ul>
        <div class="upload-actions">
            <sl-button variant="primary" type="submit" id="upload-submit" disabled>
                <sl-icon slot="prefix" name="send"></sl-icon>
                Submit
            </sl-button>
        </div>
    </form>
</div>

<script type="module">
    const input = document.getElementById('upload-input');
    const dropzone = document.getElementById('upload-dropzone');
    const fileList = document.getElementById('upload-file-list');
    const submit = document.getElementById('upload-submit');

    function renderFiles() {
        fileList.replaceChildren();
        for (const file of input.files) {
            const li = document.createElement('li');
            const icon = document.createElement('sl-icon');
            icon.setAttribute('name', 'collection');
            li.append(icon, document.createTextNode(file.name));
            fileList.append(li);
        }
        submit.disabled = input.files.length === 0;
    }

    input.addEventListener('change', renderFiles);

    ['dragenter', 'dragover'].forEach(event =>
        dropzone.addEventListener(event, e => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        })
    );

    ['dragleave', 'drop'].forEach(event =>
        dropzone.addEventListener(event, e => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
        })
    );

    dropzone.addEventListener('drop', e => {
        input.files = e.dataTransfer.files;
        renderFiles();
    });
</script>
