<div class="upload-card">
  <form action="{{ url_for('frontend.upload_recipe') }}" method="POST" enctype="multipart/form-data" id="upload-form">
    <div class="upload-dropzone" id="upload-dropzone">
      <div class="upload-icon"><sl-icon name="cloud-upload" aria-hidden="true"></sl-icon></div>
      <h2>Drop your recipes here</h2>
      <p>BeerXML files · .xml or .beerxml</p>
      <label class="file-picker" for="upload-input">Choose recipe files</label>
      <input type="file" multiple accept=".xml,.beerxml" name="recipes" id="upload-input" aria-describedby="upload-hint">
      <span id="upload-hint" class="muted">Choose one or more files to review.</span>
    </div>
    <ul class="upload-file-list" id="upload-file-list" aria-label="Selected files"></ul>
    <p id="upload-feedback" class="upload-feedback" role="status" aria-live="polite"></p>
    <div class="upload-actions"><button class="button button-primary" type="submit" id="upload-submit" disabled>Review recipes <span aria-hidden="true">→</span></button></div>
  </form>
</div>
<script type="module" src="{{ url_for('static', filename='js/import.js') }}"></script>
