[project]
name = "picobrew_server"
version = "1.2.1"
description = "A reverse-engineered server for the Picobrew homebrewing machines"
authors = [
    {name = "Tom Herold", email = "heroldtom@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["picobrew", "zymatic", "homebrewing", "beerxml"]
dependencies = [
    "Flask>=3.1.3",
    "Flask-Cors>=6.0.5",
    "webargs>=8.7.1",
    "pybeerxml>=3.0.0",
    "pydantic-xml>=2.21.1",
    "uvicorn>=0.54.0",
    "a2wsgi>=1.10.10",
]

[project.urls]
Repository = "https://github.com/hotzenklotz/picobrew-server"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty]
# https://docs.astral.sh/ty
