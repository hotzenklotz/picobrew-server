[project]
name = "picobrew_server"
version = "1.2.1"
description = "A reverse-engineered server for the Picobrew homebrewing machines"
authors = [
    {name = "Tom Herold", email = "heroldtom@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["picobrew", "zymatic", "homebrewing", "beerxml"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Flask>=3.1.3",
    "Flask-Cors>=6.0.5",
    "gunicorn>=26.2.0",
    "webargs>=8.7.1",
    "pybeerxml>=3.0.0",
    "pydantic-xml>=2.21.1",
]

[project.scripts]
picobrew-server = "picobrew_server.cli:main"

[project.urls]
Documentation = "https://picobrew-server.onrender.com/"
Repository = "https://github.com/hotzenklotz/picobrew-server"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]
docs = [
    "zensical>=0.0.74 ; python_full_version >= '3.11'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty]
# https://docs.astral.sh/ty
